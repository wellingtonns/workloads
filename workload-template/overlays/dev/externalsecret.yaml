apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{APP_NAME}}-secrets
  namespace: {{APP_NAME}}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{APP_NAME}}-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: {{APP_NAME}}
    rewrite:
    - regexp:
        source: "(.*)"
        target: "$1"
