apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: js-app-secrets
  namespace: js-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: js-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: js-app
    rewrite:
    - regexp:
        source: "(.*)"
        target: "$1"