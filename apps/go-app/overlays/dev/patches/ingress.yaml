apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dev
    external-dns.alpha.kubernetes.io/hostname: go-app.dominio.com.br
spec:
  rules:
    - host: go-app.dominio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-app
                port:
                  number: 80
  tls:
    - hosts:
        - go-app.dominio.com.br
      secretName: go-app-letsencrypt-secret