apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-app-secrets
  namespace: go-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: go-app-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: go-app
    rewrite:
    - regexp:
        source: "(.*)"
        target: "$1"