apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-app
resources:
- ../../base
- externalsecret.yaml
- configmap.yaml
images:
- name: app
  newName: ghcr.io/wellingtonns/go-app
  newTag: 9d45ebf0ab2320516cb100770f51e4a3a829905d

patches:
- path: patches/rollout.yaml
  target:
    kind: Rollout
    name: go-app
- path: patches/hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: go-app
- path: patches/ingress.yaml
  target:
    kind: Ingress
    name: go-app
