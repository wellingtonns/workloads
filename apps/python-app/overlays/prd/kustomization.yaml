apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: python-app
resources:
  - ../../base
  - externalsecret.yaml
  - configmap.yaml
images:
  - name: app
    newName: europe-west2-docker.pkg.dev/devops/name-registry/python-app
    newTag: a4450379e7578a13d5deec46330d38d22d5a1472

patches:
  - target:
      kind: Rollout
      name: python-app
    path: patches/rollout.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: python-app
    path: patches/hpa.yaml
  - target:
      kind: Ingress
      name: python-app
    path: patches/ingress.yaml
