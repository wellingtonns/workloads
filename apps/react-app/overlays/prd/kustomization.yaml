apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: react-app
resources:
- ../../base
- externalsecret.yaml
- configmap.yaml
images:
- name: app
  newName: ghcr.io/wellingtonns/react-app
  newTag: 57ff56c293bf18175195074ad830ef9ed807098c

patches:
- path: patches/rollout.yaml
  target:
    kind: Rollout
    name: react-app
- path: patches/hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: react-app
- path: patches/ingress.yaml
  target:
    kind: Ingress
    name: react-app
