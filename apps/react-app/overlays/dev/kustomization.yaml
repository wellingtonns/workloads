apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: react-app
resources:
  - ../../base
  - externalsecret.yaml
  - configmap.yaml
images:
  - name: app
    newName: europe-west2-docker.pkg.dev/devops/name-registry/react-app
    newTag: 09737333d23d56fb096ce972f338641867a13001
    
patches:
  - target:
      kind: Rollout
      name: react-app
    path: patches/rollout.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: react-app
    path: patches/hpa.yaml
  - target:
      kind: Ingress
      name: react-app
    path: patches/ingress.yaml
