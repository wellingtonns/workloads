apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextjs-app
resources:
- ../../base
- externalsecret.yaml
- configmap.yaml
images:
- name: app
  newName: ghcr.io/wellingtonns/nextjs-app
  newTag: bca81d62e479b5ee4bcffe88f5439a2cd09a4ba8
    
patches:
- path: patches/rollout.yaml
  target:
    kind: Rollout
    name: nextjs-app
- path: patches/hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: nextjs-app
- path: patches/ingress.yaml
  target:
    kind: Ingress
    name: nextjs-app
