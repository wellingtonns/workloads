apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-clinica
resources:
- ../../base
- externalsecret.yaml
- configmap.yaml
images:
- name: app
  newName: ghcr.io/wellingtonns/app-clinica
  newTag: 5a1d91f582e1f30ac2de19cc9644e2114ab89c07
    
patches:
- path: patches/rollout.yaml
  target:
    kind: Rollout
    name: app-clinica
- path: patches/hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: app-clinica
- path: patches/ingress.yaml
  target:
    kind: Ingress
    name: app-clinica
