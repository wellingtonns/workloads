apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-clinica-secrets
  namespace: app-clinica
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: app-clinica-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: app-clinica
    rewrite:
    - regexp:
        source: "(.*)"
        target: "$1"
